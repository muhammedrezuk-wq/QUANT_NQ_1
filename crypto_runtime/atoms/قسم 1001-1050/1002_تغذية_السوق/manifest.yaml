  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 3
  restart_backoff_ms: 3000
config_schema:
  type: object
  properties: {}
  required: []
  additionalProperties: false
config: {}
metadata:
  market: crypto
  phase: A
  role: feed
  no_senses: true
