id: 1002
name: Crypto Market Feed
version: 1.0.0
core_version: ">=1.22.0,<2.0.0"
critical: true
entrypoint: atom:Atom
dependencies:
  - id: 1001
    version: ">=1.0.0,<2.0.0"
publishes:
  - crypto.feed.tick
  - crypto.feed.state
subscribes:
  - crypto.market.ticker.all
startup_mode: auto
health:
