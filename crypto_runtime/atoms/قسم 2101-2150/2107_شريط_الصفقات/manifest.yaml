id: 2107
name: Trade Tape Receiver
version: 2.0.1
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- market_data.trade_tape_updated
subscribes:
- market.trade
startup_mode: manual
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 3000
config_schema:
  type: object
  properties:
    source_event:
      type: string
    window_size:
      type: integer
      minimum: 10
      maximum: 10000
    publish_every_n_trades:
      type: integer
      minimum: 1
  required:
  - source_event
  - window_size
  - publish_every_n_trades
  additionalProperties: false
config:
  source_event: market.trade
  window_size: 500
  publish_every_n_trades: 10
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 107
  legacy_source: true
  phase: full-source
