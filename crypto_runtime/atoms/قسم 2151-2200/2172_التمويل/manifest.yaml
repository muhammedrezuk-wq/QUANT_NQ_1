id: 2172
name: Funding Rate (Crowd Poll)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.funding.state
subscribes:
- market.funding
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    neutral:
      type: number
    long_thresh:
      type: number
    short_thresh:
      type: number
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  neutral: 0.004
  long_thresh: 0.01
  short_thresh: -0.003
  max_age_s: 60
metadata:
  max_idle_s: 120
  market: crypto
  namespace: crypto_full
  source_id: 172
  legacy_source: true
  phase: full-source
