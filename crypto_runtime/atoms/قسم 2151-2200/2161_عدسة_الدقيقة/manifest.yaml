id: 2161
name: 1-Minute Lens (last 15 bars, relative volume)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.min1_lens.state
subscribes:
- market.candle
startup_mode: auto
health:
  interval_ms: 15000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    timeframe:
      type: string
    display:
      type: integer
      minimum: 1
    vol_ma:
      type: integer
      minimum: 1
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  timeframe: 1m
  display: 15
  vol_ma: 20
  max_age_s: 180
metadata:
  max_idle_s: 300
  market: crypto
  namespace: crypto_full
  source_id: 161
  legacy_source: true
  phase: full-source
