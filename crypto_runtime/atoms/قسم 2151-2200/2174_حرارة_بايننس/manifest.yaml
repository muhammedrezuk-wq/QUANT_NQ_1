      type: number
      minimum: 1
    max_log_rows:
      type: integer
      minimum: 10
  additionalProperties: false
config:
  window_s: 1800
  oi_flat_pct: 0.05
  max_age_s: 300
  max_log_rows: 2000
metadata:
  max_idle_s: 600
