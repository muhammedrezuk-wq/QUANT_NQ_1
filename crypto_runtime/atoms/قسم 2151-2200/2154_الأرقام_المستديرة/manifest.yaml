id: 2154
name: Round Numbers (Psychological Levels)
version: 1.2.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.round_numbers.state
subscribes:
- market.candle
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    timeframe:
      type: string
    major_step:
      type: number
      minimum: 0.0001
    mid_step:
      type: number
      minimum: 0.0001
    minor_step:
      type: number
      minimum: 0.0001
    max_age_s:
      type: number
      minimum: 1
    auto_scale:
      type: boolean
  additionalProperties: false
config:
  timeframe: 5m
  # الخطوات الثابتة تبقى مسجّلة كمرجع، وتُستعمل فقط عند auto_scale: false.
  major_step: 1000
  mid_step: 500
  minor_step: 100
  # 2026-09-01: الخطوة تتبع عَشْرية سعر الرمز. الثوابت أعلاه مفصّلة لسعر
  # بحجم البتكوين، وكانت تُطبَّق على كل رمز — فأي عملة دون الألف تخرج
  # مستوياتها {below: 0, above: 1000}: شاهد نفسيّ فارغ يدخل التجمّع.
  auto_scale: true
  max_age_s: 600
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 154
  legacy_source: true
  phase: full-source
