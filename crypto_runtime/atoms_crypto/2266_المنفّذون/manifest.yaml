id: 2266
name: Aggressor Flow (Executors + Absorption)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.aggressor.state
subscribes:
- market.trade
startup_mode: auto
health:
  interval_ms: 15000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    window_trades:
      type: integer
      minimum: 2
      maximum: 5000
    dominance_threshold:
      type: number
      minimum: 0.5
      maximum: 1
    flat_bps:
      type: number
      minimum: 0
    min_samples:
      type: integer
      minimum: 1
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  window_trades: 100
  dominance_threshold: 0.65
  flat_bps: 2.0
  min_samples: 20
  max_age_s: 15.0
metadata:
  max_idle_s: 60
  market: crypto
  namespace: crypto_full
  source_id: 266
  legacy_source: true
  phase: full-source
