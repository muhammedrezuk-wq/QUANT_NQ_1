id: 2155
name: Session Volume Profile (POC/VAH/VAL)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.volume_profile.state
subscribes:
- market.candle
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    timeframe:
      type: string
    bin_frac:
      type: number
      minimum: 1.0e-05
      maximum: 0.01
    value_area_pct:
      type: number
      minimum: 0.5
      maximum: 0.95
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  timeframe: 5m
  bin_frac: 0.0003
  value_area_pct: 0.7
  max_age_s: 600
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 155
  legacy_source: true
  phase: full-source
