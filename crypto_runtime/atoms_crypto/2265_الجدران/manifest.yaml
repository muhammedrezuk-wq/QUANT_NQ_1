id: 2265
name: Depth Walls (Resting Liquidity)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.walls.state
subscribes:
- market.depth
startup_mode: auto
health:
  interval_ms: 15000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    levels:
      type: integer
      minimum: 1
      maximum: 200
    top_n:
      type: integer
      minimum: 1
      maximum: 20
    near_bps:
      type: number
      minimum: 0
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  levels: 100
  top_n: 3
  near_bps: 2.5
  max_age_s: 10.0
metadata:
  max_idle_s: 60
  market: crypto
  namespace: crypto_full
  source_id: 265
  legacy_source: true
  phase: full-source
