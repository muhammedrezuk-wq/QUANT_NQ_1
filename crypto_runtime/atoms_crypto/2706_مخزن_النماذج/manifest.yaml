id: 2706
name: Model Store
version: 2.1.2
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- storage.model_saved_confirmed
- model.persisted
- storage.persistence.load_response
- storage.persistence.save_failed
subscribes:
- model.persist_requested
- storage.persistence.load_requested
startup_mode: manual
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 3000
config_schema:
  type: object
  properties:
    db_path:
      type: string
    max_db_bytes:
      type: integer
      minimum: 1
    keep_versions_per_model:
      type: integer
      minimum: 0
  required:
  - db_path
  - keep_versions_per_model
  - max_db_bytes
  additionalProperties: false
config:
  max_db_bytes: 2000000000
  db_path: var/store\models.db
  keep_versions_per_model: 10
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 706
  legacy_source: true
  phase: full-source
