id: 832
name: "System Diagnostician"
version: "1.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "system.diagnosis.state"

subscribes:
  - "system.alert.state"
  - "measurement.health.state"
  - "measurement.latency.state"
  - "market.regime.state"
  - "drift.vector.state"
  - "adaptation.kill_switch.state"
  - "decision.behaviour.telemetry"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties: {}
  additionalProperties: false

config: {}

metadata:
  name_ar: "المُشخِّص"
  max_idle_s: 300
