id: 709
name: "Portfolio Store"
version: "2.4.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "storage.portfolio_saved"

subscribes:
  - "portfolio.summary"
  - "portfolio.overview.state"
  - "SYS_DAY"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 10000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 3000

config_schema:
  type: object
  properties:
    db_path:
      type: string
    min_write_interval_s:
      type: number
      minimum: 0
    retention_days:
      type: integer
      minimum: 0
    max_rows: {type: integer, minimum: 1}
    max_db_bytes: {type: integer, minimum: 1}
  required:
    - db_path
    - min_write_interval_s
    - retention_days
    - max_rows
    - max_db_bytes
  additionalProperties: false

config:
  db_path: 'var/store\portfolio.db'
  min_write_interval_s: 60.0
  max_rows: 1000000
  max_db_bytes: 1000000000
  retention_days: 365
metadata:
  max_idle_s: 301
