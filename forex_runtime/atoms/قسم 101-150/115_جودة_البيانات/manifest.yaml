id: 115
name: "Raw Data Quality Monitor"
version: "4.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "market_data.quality_alert"
  - "market_data.quality.state"

subscribes:
  - "market.tick"
  - "platform.account.state"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 3
  restart_backoff_ms: 2000

config_schema:
  type: object
  properties:
    gap_threshold_s:
      type: number
      minimum: 0
    spike_pct:
      type: number
      minimum: 0
    spread_pct:
      type: number
      minimum: 0
  required:
    - gap_threshold_s
    - spike_pct
    - spread_pct
  additionalProperties: false

config:
  gap_threshold_s: 5.0
  spike_pct: 5.0
  spread_pct: 1.0
metadata:
  max_idle_s: 151
