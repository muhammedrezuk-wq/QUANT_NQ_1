id: 512
name: "Asset Dollar Stop"
version: "2.2.2"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies:
  - id: 518
    version: "*"

publishes:
  - "risk.asset_stop.state"
  - "risk.structure_stop.state"

subscribes:
  - "risk.asset_ledger.state"

startup_mode: auto

health:
  interval_ms: 15000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000

config_schema:
  type: object
  properties:
    price_decimals:
      type: integer
      minimum: 0
      maximum: 12
  required:
    - price_decimals
  additionalProperties: false

config:
  price_decimals: 8
metadata:
  max_idle_s: 3600
