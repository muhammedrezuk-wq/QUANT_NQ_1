id: 506
name: Session Limits
version: 1.4.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- risk.session_limits.state
- risk.halt.requested
subscribes:
- analysis.session.state
- platform.account.state
- risk.loss_reported
- platform.trade_event
- SYS_DAY
- risk.kill_switch.reset_requested
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000
config_schema:
  type: object
  properties:
    max_session_loss_pct:
      type: number
      minimum: 0
    max_session_trades:
      type: integer
      minimum: 0
    max_equity_drawdown_pct:
      type: number
      minimum: 0
  required:
  - max_session_loss_pct
  - max_session_trades
  - max_equity_drawdown_pct
  additionalProperties: false
config:
  max_session_loss_pct: 3.0
  max_session_trades: 10
  max_equity_drawdown_pct: 10.0
metadata:
  max_idle_s: 3600
