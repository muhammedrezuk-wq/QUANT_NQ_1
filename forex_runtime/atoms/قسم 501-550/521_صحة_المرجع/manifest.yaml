id: 521
name: "Reference Feed Health"
version: "2.4.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "reference.health.state"

subscribes:
  - "feed.ctrader.tick"
  - "feed.mt5.tick"
  - "market.reference"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 5000
  timeout_ms: 2000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    symbols:
      type: array
      items:
        type: string
    max_data_age_s:
      type: number
      minimum: 0
    fallback_max_age_s:
      type: number
      minimum: 0
    max_sane_spread:
      type: number
      minimum: 0
    max_tick_jump:
      type: number
      minimum: 0
    min_dwell_s:
      type: number
      minimum: 0
  required:
    - symbols
    - max_data_age_s
    - fallback_max_age_s
    - max_sane_spread
    - max_tick_jump
    - min_dwell_s
  additionalProperties: false

config:
  symbols: []
  max_data_age_s: 5
  fallback_max_age_s: 30
  max_sane_spread: 60
  max_tick_jump: 500
  min_dwell_s: 0
metadata:
  max_idle_s: 60
