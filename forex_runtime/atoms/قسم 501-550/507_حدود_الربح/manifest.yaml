id: 507
name: Profit Limits
version: 1.3.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- risk.profit_limits.state
- risk.halt.requested
subscribes:
- risk.loss_reported
- platform.account.state
- SYS_DAY
- risk.kill_switch.reset_requested
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000
config_schema:
  type: object
  properties:
    daily_profit_target_pct:
      type: number
      minimum: 0
    max_profit_giveback_pct:
      type: number
      minimum: 0
  required:
  - daily_profit_target_pct
  - max_profit_giveback_pct
  additionalProperties: false
config:
  daily_profit_target_pct: 0.0
  max_profit_giveback_pct: 0.0
metadata:
  max_idle_s: 3600
