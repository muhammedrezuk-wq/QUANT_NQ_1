id: 580
name: "Multi-Level Tilt Engine"
version: "1.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

# NQ seal item 22 package TH (paper Q10 + continuity amendment S52):
# input is the APPROVED decision and its eight outputs exclusively
# (decision.gate.passed from 467 -- no pre-filter scores). Output is a
# graduated tilt with its full reason (tilt.state) plus the owner rules
# state (tilt.rules.state). The engine owns no decision, never flips a
# side, and issues no execution command: the coupling of the tilt into
# the target equation is an open owner decision.
publishes:
  - "tilt.state"
  - "tilt.rules.state"

subscribes:
  - "decision.gate.passed"
  - "tilt.rule.command"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    db_path:
      type: string
    tilt_max_total:
      type: number
      minimum: 0
  required:
    - db_path
    - tilt_max_total
  additionalProperties: false

# tilt_max_total (Q10 S23/S43): the paper gives NO number -- 0.0 means no
# tilt leaves the engine until the owner sets the cap himself. Promotion to
# a governed dial (decision.settings.command) needs a shared/ registry line
# by the coordinator; until then this config value is the only source.
config:
  db_path: 'var/store/tilt_rules.db'
  tilt_max_total: 0.0
metadata:
  max_idle_s: 3600
