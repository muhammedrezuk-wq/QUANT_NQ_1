id: 552
name: Order Validator
version: "5.5.0"
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- trading.final_decision
- execution.order.rejected
- execution.gate.state
subscribes:
- execution.gate.state
- execution.order.legal
- emergency.halt
- risk.kill_switch.reset_requested
- allowed.symbols.state
- feed.mt5.tick
- execution.gate.command
- market.symbol_specs
- platform.account.state
- execution.reconcile.state
- reference.health.state
- risk.exposure.state
- risk.margin.validation.completed
- execution.snapshot.state
startup_mode: auto
health:
  interval_ms: 1000
  timeout_ms: 500
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    enabled:
      type: boolean
    max_spread_points:
      type: number
      minimum: 0
    spread_ttl_s:
      type: number
      minimum: 0.1
      maximum: 300
  required:
  - enabled
  - max_spread_points
  additionalProperties: false
config:
  enabled: true
  max_spread_points: 2000.0
  spread_ttl_s: 5.0
metadata:
  max_idle_s: 60
