id: 574
name: "Partial Close"
version: "1.0.2"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "execution.manage.intent"

subscribes:
  - "platform.positions.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    partial_at_r:
      type: number
      minimum: 0
    partial_fraction:
      type: number
      minimum: 0
      maximum: 1
    min_partial_lot:
      type: number
      minimum: 0
  required:
    - partial_at_r
    - partial_fraction
    - min_partial_lot
  additionalProperties: false

config:
  partial_at_r: 1.0
  partial_fraction: 0.5
  min_partial_lot: 0.01
metadata:
  max_idle_s: 3600
