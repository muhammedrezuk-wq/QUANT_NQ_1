id: 577
name: "Stop Maintenance"
version: "1.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "execution.manage.command"

subscribes:
  - "perpetual.plan.state"
  - "platform.positions.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    min_sl_change:
      type: number
      minimum: 0
  additionalProperties: false

config:
  min_sl_change: 0.000000001
metadata:
  max_idle_s: 3600
