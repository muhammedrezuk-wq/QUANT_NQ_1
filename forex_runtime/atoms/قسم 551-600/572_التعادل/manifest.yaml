id: 572
name: "Breakeven"
version: "1.0.1"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "execution.manage.intent"

subscribes:
  - "platform.positions.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    breakeven_at_r:
      type: number
      minimum: 0
  required:
    - breakeven_at_r
  additionalProperties: false

config:
  breakeven_at_r: 1.0
metadata:
  max_idle_s: 3600
