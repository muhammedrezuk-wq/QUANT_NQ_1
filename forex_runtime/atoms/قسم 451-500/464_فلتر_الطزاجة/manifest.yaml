id: 464
name: "Freshness Filter"
version: "1.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "decision.filter.freshness.state"

subscribes:
  - "SYS_SECOND"
  - "market.tick.validated"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000

config_schema:
  type: object
  properties:
    db_path:
      type: string
    table_name:
      type: string
    poll_interval_s:
      type: number
      minimum: 0.1
    stale_threshold_s:
      type: number
      minimum: 1
  required:
    - db_path
    - table_name
    - poll_interval_s
    - stale_threshold_s
  additionalProperties: false

config:
  db_path: 'C:\Users\NQ\AppData\Roaming\MetaQuotes\Terminal\Common\Files\nq_brain.db'
  table_name: "prices"
  poll_interval_s: 5.0
  stale_threshold_s: 180.0
metadata:
  max_idle_s: 151
