id: 468
name: "Asset Control Filter"
version: "1.5.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "decision.filter.asset.state"
  - "allowed.symbols.state"

subscribes:
  - "market.tick.validated"
  - "perpetual.asset.activate"
  - "risk.asset.command"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    allowed_symbols:
      type: array
      items:
        type: string
  required:
    - allowed_symbols
  additionalProperties: false

config:
  allowed_symbols:
    - "BTCUSD"
metadata:
  max_idle_s: 301
