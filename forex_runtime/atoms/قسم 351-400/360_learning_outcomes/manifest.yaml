id: 360
name: Learning Outcome Collector
version: 1.2.1
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- learning.outcome.recorded
subscribes:
- decision.scored.state
- decision.resolved.state
- trading.final_decision
- market.outcome.realized
- market.tick.validated
startup_mode: auto
health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties: {}
  additionalProperties: false
config: {}
metadata:
  max_idle_s: 86400
