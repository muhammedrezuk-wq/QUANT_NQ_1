id: 368
name: Learning Drift And Rollback
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- learning.model.drift.state
- learning.model.rollback_requested
subscribes:
- learning.outcome.recorded
- learning.model.active.state
startup_mode: auto
health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    min_samples:
      type: integer
      minimum: 1
    min_accuracy:
      type: number
      minimum: 0
      maximum: 1
    window_size:
      type: integer
      minimum: 1
    rollback_cooldown_seconds:
      type: number
      minimum: 0
  required:
  - min_samples
  - min_accuracy
  - window_size
  - rollback_cooldown_seconds
  additionalProperties: false
config:
  min_samples: 20
  min_accuracy: 0.45
  window_size: 200
  rollback_cooldown_seconds: 3600
metadata:
  max_idle_s: 86400
