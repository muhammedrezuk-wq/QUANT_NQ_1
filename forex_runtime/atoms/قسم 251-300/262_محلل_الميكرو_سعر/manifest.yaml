id: 262
name: "Microprice Analyzer"
version: "1.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "liquidity.microprice.state"

subscribes:
  - "market_data.depth_updated"

startup_mode: auto

health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    weight:
      type: number
      minimum: 0
    required_levels:
      type: number
      minimum: 1
  additionalProperties: false

config:
  weight: 20.0
  required_levels: 3.0
metadata:
  max_idle_s: 60
