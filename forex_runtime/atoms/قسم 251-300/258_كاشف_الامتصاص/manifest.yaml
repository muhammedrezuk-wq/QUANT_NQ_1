id: 258
name: "Absorption Detector"
version: "1.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "liquidity.absorption.state"

subscribes:
  - "liquidity.delta.state"
  - "market_data.candle_closed"

startup_mode: manual

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    absorption_ratio:
      type: number
      minimum: 0
  required:
    - absorption_ratio
  additionalProperties: false

config:
  absorption_ratio: 1000
metadata:
  max_idle_s: 300
