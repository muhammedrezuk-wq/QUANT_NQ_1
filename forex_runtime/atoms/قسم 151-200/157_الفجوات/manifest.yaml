id: 157
name: "Gap Analyzer"
version: "2.5.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "analysis.gap.state"
  - "analysis.setting.changed"

subscribes:
  - "market_data.candle_closed"

  - "market.tick.validated"
  - "analysis.settings.command"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    gap_threshold_pct:
      type: number
      minimum: 0
  required:
    - gap_threshold_pct
  additionalProperties: false

config:
  gap_threshold_pct: 0.1
metadata:
  max_idle_s: 301
