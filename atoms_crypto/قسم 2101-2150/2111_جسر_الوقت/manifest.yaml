id: 2111
name: Time Bridge
version: 3.0.1
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies:
- id: 2003
  version: '>=3.0.0,<4.0.0'
publishes:
- market.time.drift
- market.time.synced
- time.clock.divergence
subscribes:
- time.utc.drift
- time.utc.synced
- kernel.clock.heartbeat
startup_mode: manual
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    max_age_s:
      type: number
      minimum: 1
    divergence_threshold_s:
      type: number
      minimum: 0.001
  required:
  - max_age_s
  - divergence_threshold_s
  additionalProperties: false
config:
  max_age_s: 5
  divergence_threshold_s: 0.5
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 111
  legacy_source: true
  phase: full-source
