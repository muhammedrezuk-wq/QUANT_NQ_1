id: 2159
name: Higher-Timeframe Context (4H map + 15m structure)
version: 1.1.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- sense.htf.state
subscribes:
- market.candle
startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    timeframe_map:
      type: string
    timeframe_struct:
      type: string
    range_bars:
      type: integer
      minimum: 2
    slope_bars:
      type: integer
      minimum: 1
    struct_bars:
      type: integer
      minimum: 1
    extreme_high_pct:
      type: number
      minimum: 50
      maximum: 100
    extreme_low_pct:
      type: number
      minimum: 0
      maximum: 50
    max_age_s:
      type: number
      minimum: 1
  additionalProperties: false
config:
  timeframe_map: 4h
  timeframe_struct: 15m
  range_bars: 84
  slope_bars: 4
  struct_bars: 8
  extreme_high_pct: 85
  extreme_low_pct: 15
  max_age_s: 1200
metadata:
  max_idle_s: 18000
  market: crypto
  namespace: crypto_full
  source_id: 159
  legacy_source: true
  phase: full-source
