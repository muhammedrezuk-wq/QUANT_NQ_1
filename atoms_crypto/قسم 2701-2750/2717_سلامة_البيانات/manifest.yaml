id: 2717
name: Trading Data Integrity
version: 2.0.2
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- storage.trading_data_integrity_checked
subscribes:
- storage.trading_data_cleaned
startup_mode: manual
health:
  interval_ms: 60000
  timeout_ms: 10000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 3000
config_schema:
  type: object
  properties:
    stores:
      type: array
      minItems: 1
      items:
        type: object
        properties:
          db_path:
            type: string
          table:
            type: string
          time_column:
            type: string
        required:
        - db_path
        - table
        - time_column
        additionalProperties: false
    warn_on_empty_table:
      type: boolean
  required:
  - stores
  - warn_on_empty_table
  additionalProperties: false
config:
  stores:
  - db_path: var/store\market_data.db
    table: market_data
    time_column: occurred_at
  - db_path: var/store\orders.db
    table: orders
    time_column: occurred_at
  - db_path: var/store\timeline.db
    table: timeline
    time_column: occurred_at
  - db_path: var/store\portfolio.db
    table: portfolio
    time_column: occurred_at
  - db_path: var/store\analysis.db
    table: analysis
    time_column: occurred_at
  - db_path: var/store\structure.db
    table: structure
    time_column: occurred_at
  - db_path: var/store\liquidity.db
    table: liquidity
    time_column: occurred_at
  - db_path: var/store\trades.db
    table: trades
    time_column: closed_at
  - db_path: var/store\decisions.db
    table: decisions
    time_column: decided_at
  warn_on_empty_table: false
metadata:
  max_idle_s: 3600
  market: crypto
  namespace: crypto_full
  source_id: 717
  legacy_source: true
  phase: full-source
