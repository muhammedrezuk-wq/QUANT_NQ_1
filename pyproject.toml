[project]
name = "quant-nq-core"
version = "1.27.0"
description = "QUANT_NQ — Core Infrastructure (Core V1.0). لا يحتوي أي منطق تداول."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "packaging>=24.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "shared*", "transport*", "security*", "governance*", "clock*", "catchup*", "storage_policy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# 2026-08-16: 212 atoms each carry tests/test_atom.py. Under the default import
# mode pytest derives the module name from the file name, so all 212 collide and
# collection dies with 210 "import file mismatch" errors -- 9 tests collected out
# of 852. importlib gives each file its own module identity, so the whole suite
# becomes collectable without renaming a single file or adding __init__.py.
addopts = "--import-mode=importlib"
