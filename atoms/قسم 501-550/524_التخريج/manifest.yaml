id: 524
name: "Cumulative Gross Profit Extraction"
version: "3.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "asset.extraction.state"
  - "asset.extraction.requested"
  - "asset.full_extraction.requested"
  - "risk.asset_profit.extracted"

subscribes:
  - "risk.asset_ledger.state"
  - "asset.extraction.confirmed"
  - "asset.extraction.failed"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    milestone_mult:
      type: number
      minimum: 1
    extract_fraction:
      type: number
      minimum: 0
      maximum: 1
    full_targets:
      type: object
    default_full_target:
      type: number
      minimum: 0
  additionalProperties: false

config:
  milestone_mult: 2.0
  extract_fraction: 0.5
  full_targets: {}
  default_full_target: 0.0
metadata:
  max_idle_s: 3600
