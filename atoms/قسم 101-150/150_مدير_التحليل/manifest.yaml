id: 150
name: "Analysis Manager"
version: "2.9.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "analysis.cycle.collected"
  - "analysis.analysts.state"
  - "decision.settings.state"

subscribes:
  - "market_data.candle_closed"
  - "SYS_SECOND"
  - "decision.settings.command"
  - "analysis.trend.state"
  - "analysis.momentum.state"
  - "analysis.volatility.state"
  - "analysis.volume.state"
  - "analysis.spread.state"
  - "analysis.candle.state"
  - "analysis.gap.state"
  - "analysis.session.state"
  - "analysis.time.state"
  - "analysis.velocity.state"
  - "analysis.acceleration.state"
  - "analysis.volume_quality.state"
  - "analysis.noise.state"
  - "analysis.correlation.state"
  - "analysis.relative_strength.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    timeout_seconds:
      type: number
      minimum: 0
    live_flush_timeout_s:
      type: number
      minimum: 0
  required:
    - timeout_seconds
    - live_flush_timeout_s
  additionalProperties: false

config:
  timeout_seconds: 5.0
  live_flush_timeout_s: 1.0
metadata:
  max_idle_s: 301
