id: 500
name: "Risk Read-Only Aggregator"
version: "2.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"
dependencies: []
publishes: [risk.unified.state]
subscribes:
- risk.account.state
- risk.exposure.state
- risk.profit_limits.state
- risk.session_limits.state
startup_mode: auto
health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema: {type: object, properties: {}, additionalProperties: false}
config: {}
metadata:
  max_idle_s: 3600
