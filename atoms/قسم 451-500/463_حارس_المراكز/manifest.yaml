id: 463
name: "Position Guard"
version: "1.2.1"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "decision.filter.position.state"
  - "decision.settings.state"

subscribes:
  - "platform.positions.state"
  - "decision.scored.state"
  - "decision.resolved.state"
  - "risk.asset.command"
  - "decision.settings.command"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    max_per_symbol:
      type: integer
      minimum: 1
  required:
    - max_per_symbol
  additionalProperties: false

config:
  max_per_symbol: 1
metadata:
  max_idle_s: 301
