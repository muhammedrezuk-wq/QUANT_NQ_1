id: 314
name: "Distribution Histogram"
version: "1.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "stats.distribution.state"

subscribes:
  - "market.tick.validated"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    window_size:
      type: integer
      minimum: 2
    bin_count:
      type: integer
      minimum: 2
    tail_ratio:
      type: number
      minimum: 0
  required:
    - window_size
    - bin_count
    - tail_ratio
  additionalProperties: false

config:
  window_size: 20
  bin_count: 10
  tail_ratio: 0.25
metadata:
  max_idle_s: 301
