id: 316
name: "Data Quality Monitor"
version: "1.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "stats.quality.state"

subscribes:
  - "market.tick.validated"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    window_size:
      type: integer
      minimum: 2
    min_quality:
      type: number
      minimum: 0
      maximum: 1
  required:
    - window_size
    - min_quality
  additionalProperties: false

config:
  window_size: 20
  min_quality: 0.95
metadata:
  max_idle_s: 301
