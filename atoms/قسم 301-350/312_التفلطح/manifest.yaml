id: 312
name: "Kurtosis"
version: "1.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "stats.kurtosis.state"

subscribes:
  - "market.tick.validated"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    window_size:
      type: integer
      minimum: 4
    kurt_threshold:
      type: number
      minimum: 0
  required:
    - window_size
    - kurt_threshold
  additionalProperties: false

config:
  window_size: 20
  kurt_threshold: 1
metadata:
  max_idle_s: 301
