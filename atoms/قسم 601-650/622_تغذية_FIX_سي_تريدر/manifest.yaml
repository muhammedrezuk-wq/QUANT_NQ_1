id: 622
name: cTrader FIX Price Feed
version: "1.4.0"
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- feed.ctrader.tick
- market.ctrader.symbol_specs
- market.depth
- feed.ctrader.heartbeat
- feed.ctrader.state
subscribes:
- SYS_SECOND
startup_mode: auto
health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
