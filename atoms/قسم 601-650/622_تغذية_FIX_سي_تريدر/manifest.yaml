    sender_comp_id: {type: string}
    target_comp_id: {type: string}
    sub_id: {type: string}
    username: {type: string}
    identity_account_id: {type: string}
    broker: {type: string}
    password_secret_key: {type: string}
    symbols: {type: array, items: {type: string}}
    market_depth: {type: integer, minimum: 0}
    heartbeat_s: {type: integer, minimum: 1}
    poll_interval_s: {type: number, minimum: 0}
    reconnect_backoff_s: {type: number, minimum: 0}
    live_max_backlog_bytes: {type: integer, minimum: 1024}
    tick_stale_after_s: {type: number, minimum: 1}
    depth_stale_after_s: {type: number, minimum: 1}
    specs_stale_after_s: {type: number, minimum: 1}
    dead_after_s: {type: number, minimum: 1}
  required: [host, port, use_tls, sender_comp_id, target_comp_id, sub_id, username,
    broker, password_secret_key, symbols, market_depth, heartbeat_s, poll_interval_s,
    reconnect_backoff_s, live_max_backlog_bytes, tick_stale_after_s, depth_stale_after_s, specs_stale_after_s,
    dead_after_s]
