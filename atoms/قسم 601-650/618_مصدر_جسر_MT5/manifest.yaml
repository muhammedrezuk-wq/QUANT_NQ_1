id: 618
name: MT5 Bridge Source
version: 4.4.0
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- feed.mt5.tick
- market.symbol_specs
subscribes:
- SYS_SECOND
- platform.account.state
- SYS_10MS
startup_mode: auto
health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000
config_schema:
  type: object
  properties:
    db_path:
      type: string
    table_name:
      type: string
    spec_table:
      type: string
    spec_refresh_s:
      type: number
      minimum: 1
    poll_interval_s:
      type: number
      minimum: 0
    batch_limit:
      type: integer
      minimum: 1
    delete_consumed:
      type: boolean
    max_age_s:
      type: number
      minimum: 1
  required:
  - db_path
  - table_name
  - spec_table
  - spec_refresh_s
  - poll_interval_s
  - batch_limit
  - delete_consumed
  - max_age_s
  additionalProperties: false
config:
  db_path: C:\Users\NQ\AppData\Roaming\MetaQuotes\Terminal\Common\Files\nq_brain.db
  table_name: ticks_v2
  spec_table: symbol_specs_v2
  spec_refresh_s: 300
  poll_interval_s: 0.01
  batch_limit: 500
  delete_consumed: true
  max_age_s: 30
metadata:
  max_idle_s: 60
