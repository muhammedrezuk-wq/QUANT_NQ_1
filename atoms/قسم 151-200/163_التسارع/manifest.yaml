id: 163
name: "Acceleration Analyzer"
version: "2.5.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "analysis.acceleration.state"
  - "analysis.setting.changed"

subscribes:
  - "market_data.candle_closed"

  - "market.tick.validated"
  - "analysis.settings.command"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    baseline_window:
      type: integer
      minimum: 2
    accel_ratio:
      type: number
      minimum: 0
  required:
    - baseline_window
    - accel_ratio
  additionalProperties: false

config:
  baseline_window: 24
  accel_ratio: 0.6
metadata:
  max_idle_s: 301
