id: 411
name: News Strategic Regime
version: "2.1.0"
core_version: '>=1.0.0,<2.0.0'
critical: false
entrypoint: atom:Atom
dependencies: []
publishes:
- strategy.news.state
- news.trading_window.state
subscribes:
- market.tick.validated
- market_data.news_received
- market.news.enriched
startup_mode: auto
health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    weight:
      type: number
      minimum: 0
      maximum: 100
    required_depth:
      type: number
      minimum: 0
      maximum: 100
    confidence_threshold:
      type: number
      minimum: 0
      maximum: 100
    strength_threshold:
      type: number
      minimum: 0
      maximum: 100
    required_ticks:
      type: integer
      minimum: 2
      maximum: 10000
    recent_window_s:
      type: integer
      minimum: 1
    high_window_before_min:
      type: number
      minimum: 0
    high_window_after_min:
      type: number
      minimum: 0
  required:
  - weight
  - required_depth
  - confidence_threshold
  - strength_threshold
  - required_ticks
  - recent_window_s
  - high_window_before_min
  - high_window_after_min
  additionalProperties: false
config:
  weight: 0.0
  required_depth: 60.0
  confidence_threshold: 60.0
  strength_threshold: 0.0
  required_ticks: 24
  recent_window_s: 3600
  high_window_before_min: 15.0
  high_window_after_min: 15.0
metadata:
  max_idle_s: 64
