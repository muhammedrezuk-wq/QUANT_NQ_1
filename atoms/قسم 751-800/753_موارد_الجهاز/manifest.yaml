id: 753
name: "Device Resource Monitor"
version: "2.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "tools.device_resources.state"

subscribes:
  - "SYS_5MIN"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    enable_temperature:
      type: boolean
  required: [enable_temperature]
  additionalProperties: false

config:
  enable_temperature: true
metadata:
  max_idle_s: 90
